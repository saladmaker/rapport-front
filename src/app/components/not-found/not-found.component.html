<main
  class="min-h-dvh grid place-items-center bg-gradient-to-b from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 px-4"
>
  <section
    class="w-full max-w-md rounded-2xl bg-white/90 dark:bg-slate-900/70 shadow-xl ring-1 ring-black/5 dark:ring-white/10 backdrop-blur p-8 text-center"
    aria-labelledby="notfound-title"
  >
    <!-- Icon -->
    <div class="mx-auto mb-4 size-14 grid place-items-center rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke-width="1.5" stroke="currentColor" class="size-7">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12A9 9 0 1 1 3 12a9 9 0 0 1 18 0Z" />
      </svg>
    </div>

    <!-- Title -->
    <h1 id="notfound-title"
        class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">
      404 — Page Not Found
    </h1>

    <!-- Message -->
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      Sorry, the page you are looking for does not exist.
    </p>

    <!-- Actions -->
    <div class="mt-6">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium
               bg-slate-900 text-white hover:bg-slate-800 active:bg-slate-900/90
               dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200
               focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
               focus-visible:ring-slate-400 dark:focus-visible:ring-white/50"
      >
        Go to Home
      </a>
    </div>
  </section>
</main>
