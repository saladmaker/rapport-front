<div class="min-h-screen grid place-items-center bg-gray-50 p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow p-8 ring-1 ring-gray-200">
      <!-- Logo Only (Bigger) -->
      <div class="mb-10 text-center">
        <img src="bglogo.png" alt="Login Logo" class="mx-auto h-28 object-contain" />
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate class="space-y-6">
        <!-- Username -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Nom d'utilisateur</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            [(ngModel)]="username"
            #nameCtrl="ngModel"
            class="mt-2 block w-full rounded-xl border border-gray-300 px-3 py-2 text-gray-900 shadow-sm outline-none focus:ring-2 focus:ring-emerald-600"
            [class.border-red-500]="nameCtrl.invalid && (nameCtrl.touched || loginForm.submitted)"
          />
          <p *ngIf="nameCtrl.invalid && (nameCtrl.touched || loginForm.submitted)" class="mt-1 text-xs text-red-600">
            Nom d'utilisateur est requis.
          </p>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            [(ngModel)]="password"
            #passwordCtrl="ngModel"
            class="mt-2 block w-full rounded-xl border border-gray-300 px-3 py-2 text-gray-900 shadow-sm outline-none focus:ring-2 focus:ring-emerald-600"
            [class.border-red-500]="passwordCtrl.invalid && (passwordCtrl.touched || loginForm.submitted)"
          />
          <p *ngIf="passwordCtrl.invalid && (passwordCtrl.touched || loginForm.submitted)" class="mt-1 text-xs text-red-600">
            Mot de passe est requis.
          </p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full rounded-xl bg-emerald-700 px-4 py-3 text-white font-medium shadow transition hover:bg-emerald-800 disabled:opacity-50"
        >
          Se connecter
        </button>      
      </form>

      
    </div>
  </div>
</div>
