<main
  class="min-h-dvh grid place-items-center bg-gradient-to-b from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 px-4"
>
  <section
    class="w-full max-w-md rounded-2xl bg-white/90 dark:bg-slate-900/70 shadow-xl ring-1 ring-black/5 dark:ring-white/10 backdrop-blur p-8 text-center"
    aria-labelledby="forbidden-title"
  >
    <!-- Icon -->
    <div class="mx-auto mb-4 size-14 grid place-items-center rounded-full bg-rose-500/10 text-rose-600 dark:text-rose-400">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-7" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M7 10V8a5 5 0 1 1 10 0v2" />
        <rect x="5" y="10" width="14" height="10" rx="2" />
        <path d="M12 14v3" />
      </svg>
    </div>

    <!-- Title -->
    <h1 id="forbidden-title" class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">
      403 — Forbidden
    </h1>

    <!-- Message -->
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      You do not have permission to access this page.
    </p>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-center gap-3">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium
               bg-slate-900 text-white hover:bg-slate-800 active:bg-slate-900/90
               dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200
               focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
               focus-visible:ring-slate-400 dark:focus-visible:ring-white/50"
      >
        Go to Home
      </a>

      <a
        routerLink="/login"
        class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium
               bg-white text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50
               dark:bg-slate-800 dark:text-white dark:ring-slate-700 dark:hover:bg-slate-700
               focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
               focus-visible:ring-slate-400 dark:focus-visible:ring-white/50"
      >
        Sign in
      </a>
    </div>

    <!-- Small hint -->
    <p class="mt-4 text-xs text-slate-500 dark:text-slate-400">
      If you think this is a mistake, contact support or try a different account.
    </p>
  </section>
</main>
