<!-- login.component.html -->
<div class="min-h-screen grid place-items-center bg-gray-50 p-4">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow p-8 ring-1 ring-gray-200">
        <div class="mb-8 text-center">
          <h1 class="text-2xl font-semibold text-gray-900">Sign in</h1>
          <p class="mt-2 text-sm text-gray-500">Access your account securely</p>
        </div>
  
        <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate class="space-y-5">
          <!-- Username -->
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Username</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              [(ngModel)]="username"
              #nameCtrl="ngModel"
              class="mt-2 block w-full rounded-xl border border-gray-300 px-3 py-2 text-gray-900 shadow-sm outline-none focus:ring-2 focus:ring-blue-600"
              [class.border-red-500]="nameCtrl.invalid && (nameCtrl.touched || loginForm.submitted)"
            />
            <p *ngIf="nameCtrl.invalid && (nameCtrl.touched || loginForm.submitted)" class="mt-1 text-xs text-red-600">
              Username is required.
            </p>
          </div>
  
          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              [(ngModel)]="password"
              #passwordCtrl="ngModel"
              class="mt-2 block w-full rounded-xl border border-gray-300 px-3 py-2 text-gray-900 shadow-sm outline-none focus:ring-2 focus:ring-blue-600"
              [class.border-red-500]="passwordCtrl.invalid && (passwordCtrl.touched || loginForm.submitted)"
            />
            <p *ngIf="passwordCtrl.invalid && (passwordCtrl.touched || loginForm.submitted)" class="mt-1 text-xs text-red-600">
              Password is required.
            </p>
          </div>
          
          <!-- Submit -->
          <button
            type="submit"
            [disabled]="loginForm.invalid"
            class="w-full rounded-xl bg-blue-600 px-4 py-2.5 text-white font-medium shadow transition hover:bg-blue-700 disabled:opacity-50"
          >
            Sign in
          </button>
        </form>
  
        <!-- Divider -->
        <div class="mt-6 flex items-center gap-3">
          <div class="h-px flex-1 bg-gray-200"></div>
          <span class="text-xs text-gray-400">or</span>
          <div class="h-px flex-1 bg-gray-200"></div>
        </div>
  
      <p class="mt-4 text-center text-xs text-gray-400">
        Protected by JWT • Your session is secured
      </p>
    </div>
  </div>
